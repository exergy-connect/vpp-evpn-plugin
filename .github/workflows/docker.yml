# Build and publish to GHCR:
#   ghcr.io/exergy-connect/vpp-with-evpn-plugin
#
# Uses GITHUB_TOKEN (packages: write). No Docker Hub secrets needed.

name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      vpp_version:
        description: "FD.io VPP package version (empty = latest release)"
        required: false
        default: ""
      repo:
        description: "FD.io packagecloud repo (release|master|…)"
        required: false
        default: "release"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vpp-with-evpn-plugin

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags / labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr

      - name: Resolve build-args
        id: args
        run: |
          VPP_VERSION="${{ github.event.inputs.vpp_version }}"
          REPO="${{ github.event.inputs.repo }}"
          REPO="${REPO:-release}"
          echo "vpp_version=${VPP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "git_hash=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REPO=${{ steps.args.outputs.repo }}
            VPP_VERSION=${{ steps.args.outputs.vpp_version }}
            EVPN_GIT_HASH=${{ steps.args.outputs.git_hash }}
            EVPN_BUILD_DATE=${{ steps.args.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
