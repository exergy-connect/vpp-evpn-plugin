# Build the VPP+EVPN plugin image and publish to Docker Hub as
# exergy/vpp-with-evpn-plugin.
#
# Required repo secrets:
#   DOCKERHUB_USERNAME — Docker Hub user (org push account)
#   DOCKERHUB_TOKEN    — Docker Hub access token with write to exergy/*

name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      vpp_version:
        description: "FD.io VPP package version (empty = latest release)"
        required: false
        default: ""
      repo:
        description: "FD.io packagecloud repo (release|master|…)"
        required: false
        default: "release"

permissions:
  contents: read

env:
  IMAGE_NAME: exergy/vpp-with-evpn-plugin

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build-args
        id: args
        run: |
          VPP_VERSION="${{ github.event.inputs.vpp_version }}"
          REPO="${{ github.event.inputs.repo }}"
          REPO="${REPO:-release}"
          echo "vpp_version=${VPP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REPO=${{ steps.args.outputs.repo }}
            VPP_VERSION=${{ steps.args.outputs.vpp_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # FD.io package install + cmake is slow; keep one platform for now.
          platforms: linux/amd64
